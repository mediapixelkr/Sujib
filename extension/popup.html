<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Sujib 2.0 Downloader</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 26, 43, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --accent-grad: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      width: 340px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }

    .brand-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(124, 58, 237, 0.25);
      border: 1px solid rgba(124, 58, 237, 0.4);
      color: #c084fc;
    }

    .btn-options {
      background: none;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .btn-options:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .field {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input, select {
      padding: 8px 10px;
      background: rgba(20, 30, 48, 0.95);
      border: 1px solid var(--card-border);
      border-radius: 7px;
      color: #fff;
      font-size: 0.84rem;
      outline: none;
      transition: border-color 0.15s ease;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }

    .row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button.btn-send {
      background: var(--accent-grad);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    button.btn-send:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    button.btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 10px;
      font-size: 0.82rem;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      display: none;
    }

    .status.show { display: block; }
    .status.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon-32.png" alt="Sujib logo">
      <span>SUJIB</span>
      <span class="brand-badge">2.0</span>
    </div>
    <button id="btn-open-options" class="btn-options" title="Paramètres">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Options</span>
    </button>
  </div>

  <div class="field">
    <label for="video-url">URL de la vidéo / playlist YouTube :</label>
    <input type="url" id="video-url" placeholder="https://www.youtube.com/watch?v=..." required autofocus>
  </div>

  <div class="row-2col">
    <div class="field">
      <label for="profile-select">Profil de qualité :</label>
      <select id="profile-select">
        <option value="">Chargement...</option>
      </select>
    </div>
    <div class="field">
      <label for="dest-select">Dossier de destination :</label>
      <select id="dest-select">
        <option value="">Dossier par défaut</option>
      </select>
    </div>
  </div>

  <button id="btn-send" class="btn-send">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </svg>
    <span>Télécharger avec Sujib</span>
  </button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
